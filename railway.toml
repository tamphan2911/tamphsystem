[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
preDeployCommand = "npx prisma db push --accept-data-loss --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260620093000_task_due_end_of_hanoi_day/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260622193000_add_publishers/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260622213000_add_publisher_account_scope/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260622230000_merge_publishers_and_add_account_policy/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260622234500_merge_inderscience_account/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260623001500_fix_world_scientific_account_scope/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260623004500_set_taylor_francis_publisher_account/migration.sql --schema=packages/db/prisma/schema.prisma && npx prisma db execute --file=packages/db/prisma/migrations/20260630183000_reset_task_6e34ebb4_assignees/migration.sql --schema=packages/db/prisma/schema.prisma"
startCommand = "npm run start --workspace=apps/web"
healthcheckPath = "/"
healthcheckTimeout = 100
